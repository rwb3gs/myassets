<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>家庭資產戰情室</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #121212; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        /* 密碼鎖畫面樣式 */
        #lock-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #121212; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
        }
        .lock-box { text-align: center; padding: 30px; background: #1e1e1e; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
        h2 { color: #ffffff; margin-bottom: 20px; font-size: 20px; font-weight: 400; }
        input { padding: 12px; width: 200px; background: #2d2d2d; border: 1px solid #444; border-radius: 8px; color: #fff; text-align: center; font-size: 18px; margin-bottom: 15px; outline: none; }
        button { padding: 12px 24px; background: #388e3c; border: none; border-radius: 8px; color: white; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background: #2e7d32; }
        #error-msg { color: #ff5252; font-size: 14px; margin-top: 10px; height: 20px; }

        /* 報表框架樣式 */
        #report-frame { width: 100%; height: 100%; border: none; display: none; }
    </style>
</head>
<body>

    <!-- 密碼鎖畫面 -->
    <div id="lock-screen">
        <div class="lock-box">
            <h2>🔒 請輸入安全密碼</h2>
            <input type="password" id="pwd-input" placeholder="請輸入密碼" onkeydown="if(event.keyCode==13) checkPassword()">
            <br>
            <button onclick="checkPassword()">登入戰情室</button>
            <div id="error-msg"></div>
        </div>
    </div>

    <!-- 內嵌的 Looker Studio 報表 (填入你的內嵌網址) -->
    <!-- 注意：下面的 src 請替換成你自己 Looker Studio 的「嵌入網址」 -->
    <iframe id="report-frame" src="<iframe width="375" height="1200" src="https://datastudio.google.com/embed/reporting/a152befa-6590-4d9d-b58d-e2e1493b2c09/page/p_28wb0byb4d" frameborder="0" style="border:0" allowfullscreen sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>"></iframe>

    <script>
        function checkPassword() {
            const input = document.getElementById('pwd-input').value;
            const error = document.getElementById('error-msg');
            
            // 🔑 這裡設定你的密碼，大G哥預設幫你設 1688，你可以改成自己想要的數字或英文字
            const defaultPassword = "0125"; 

            if (input === defaultPassword) {
                // 密碼正確，隱藏鎖定畫面，顯示報表
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('report-frame').style.display = 'block';
            } else {
                error.innerText = "❌ 密碼錯誤，請重新輸入！";
                document.getElementById('pwd-input').value = "";
            }
        }
    </script>
</body>
</html>
